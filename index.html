/* ═══ WHEEL DRAW ════════════════════════════════════════════════ */
function drawWheel(c){
if(!c)return;
const dpr=window.devicePixelRatio||1,W=c.offsetWidth,H=c.offsetHeight;
c.width=W*dpr;c.height=H*dpr;
const ctx=c.getContext(‘2d’);ctx.scale(dpr,dpr);
const cx=W/2,cy=H/2,R=Math.min(W,H)/2-6,rIn=R*.20;
const rg=ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
rg.addColorStop(0,’#FFF5A0’);rg.addColorStop(.3,’#FFD700’);rg.addColorStop(.7,’#C8860A’);rg.addColorStop(1,’#FFE566’);
ctx.beginPath();ctx.arc(cx,cy,R+10,0,Math.PI*2);ctx.fillStyle=rg;ctx.fill();
for(let i=0;i<28;i++){
const a=(i/28)*Math.PI*2-Math.PI/2,gx=cx+Math.cos(a)*(R+5),gy=cy+Math.sin(a)*(R+5);
const g=ctx.createRadialGradient(gx-1,gy-1,0,gx,gy,4.5),col=PRIZES[i%N].color;
g.addColorStop(0,’#FFF’);g.addColorStop(.4,col);g.addColorStop(1,darken(col,40));
ctx.beginPath();ctx.arc(gx,gy,4.5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
ctx.strokeStyle=‘rgba(255,255,255,0.6)’;ctx.lineWidth=.8;ctx.stroke();
}
PRIZES.forEach((p,i)=>{
const sA=i*SEG_RAD-Math.PI/2,eA=sA+SEG_RAD,mA=sA+SEG_RAD/2;
const gx1=cx+Math.cos(mA)*R*.15,gy1=cy+Math.sin(mA)*R*.15,gx2=cx+Math.cos(mA)*R*.98,gy2=cy+Math.sin(mA)*R*.98;
const sg=ctx.createLinearGradient(gx1,gy1,gx2,gy2);sg.addColorStop(0,p.light);sg.addColorStop(.45,p.color);sg.addColorStop(1,p.dark);
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,sA,eA);ctx.closePath();ctx.fillStyle=sg;ctx.fill();
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,sA,eA);ctx.closePath();ctx.strokeStyle=‘rgba(255,255,255,0.55)’;ctx.lineWidth=2;ctx.stroke();
ctx.save();ctx.translate(cx,cy);ctx.rotate(mA+Math.PI/2);
ctx.shadowColor=‘rgba(0,0,0,0.7)’;ctx.shadowBlur=6;ctx.textAlign=‘center’;ctx.textBaseline=‘middle’;ctx.fillStyle=’#FFF’;
if(p.isSpecial){
ctx.font=`${Math.round(R*.13)}px serif`;ctx.fillText(‘📱’,0,-(R*.52));
ctx.font=`900 ${Math.round(R*.088)}px 'Segoe UI',sans-serif`;ctx.fillText(‘အထူးဆု’,0,-(R*.36));
ctx.font=`700 ${Math.round(R*.063)}px 'Segoe UI',sans-serif`;ctx.fillStyle=‘rgba(255,255,255,0.85)’;ctx.fillText(‘iPhone 17’,0,-(R*.22));
}else{
ctx.font=`900 ${Math.round(R*.108)}px 'Segoe UI',sans-serif`;ctx.fillText(p.display,0,-(R*.62));
ctx.font=`700 ${Math.round(R*.068)}px 'Segoe UI',sans-serif`;ctx.fillStyle=‘rgba(255,255,255,0.85)’;ctx.fillText(‘MMK’,0,-(R*.77));
ctx.font=`${Math.round(R*.11)}px serif`;ctx.fillStyle=’#FFF’;ctx.fillText(‘🪙’,0,-(R*.30));
}
ctx.restore();
});
const hg=ctx.createRadialGradient(cx-rIn*.3,cy-rIn*.3,0,cx,cy,rIn);
hg.addColorStop(0,’#FFFDE0’);hg.addColorStop(.4,’#FFD700’);hg.addColorStop(.75,’#C8860A’);hg.addColorStop(1,’#7A4F00’);
ctx.beginPath();ctx.arc(cx,cy,rIn,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();
ctx.strokeStyle=‘rgba(255,255,255,0.8)’;ctx.lineWidth=3;ctx.stroke();
ctx.save();ctx.font=`900 ${Math.round(rIn*.7)}px 'Segoe UI',sans-serif`;ctx.textAlign=‘center’;ctx.textBaseline=‘middle’;ctx.fillStyle=’#003580’;ctx.fillText(‘K’,cx,cy);ctx.restore();
}

    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;">
      <button id="cbk" style="background:rgba(255,255,255,0.2);border:none;border-radius:9px;width:34px;height:34px;color:white;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;">←</button>
      <div style="width:38px;height:38px;border-radius:11px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;"><span style="color:#005DB8;font-weight:900;font-size:11px;line-height:1.1;">KBZ</span><span style="color:#005DB8;font-weight:700;font-size:8px;">Pay</span></div>
      <div style="flex:1;min-width:0;"><div style="color:white;font-weight:800;font-size:13px;">KBZPay Service Team</div><div style="color:rgba(255,255,255,0.65);font-size:10px;display:flex;align-items:center;gap:3px;"><span style="width:6px;height:6px;border-radius:50%;background:#4AFF91;display:inline-block;"></span>Online · 24/7</div></div>
    </div>
  </div>
  ${S.winHistory.length>0?`<div style="background:rgba(255,215,0,0.07);border-bottom:1px solid rgba(255,215,0,0.12);padding:8px 13px;flex-shrink:0;">
    <div style="color:rgba(255,255,255,0.35);font-size:9px;font-weight:700;letter-spacing:1px;margin-bottom:4px;">💰 ဆုငွေ ${total?total.toLocaleString()+' MMK':''}</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;">${S.winHistory.map(h=>`<div style="padding:2px 8px;border-radius:20px;background:${h.color}15;border:1px solid ${h.color}38;color:${h.color};font-size:10px;font-weight:800;">${h.isSpecial?'📱 iPhone':h.display+' MMK'}</div>`).join('')}</div>
  </div>`:''}
  <div id="cmsgs" style="flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:10px;">
    <div style="text-align:center;"><span style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:4px 12px;color:rgba(255,255,255,.22);font-size:10px;">🔒 Secure Chat</span></div>
  </div>
  <div id="ipstrip" style="display:none;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.06);padding:8px 13px;flex-shrink:0;">
    <div id="iplist" style="display:flex;gap:7px;overflow-x:auto;"></div>
  </div>
  <div style="background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.06);padding:9px 10px;flex-shrink:0;display:flex;align-items:flex-end;gap:7px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));">
    <button id="cpbtn" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:10px;width:38px;height:38px;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">📷</button>
    <input type="file" id="cfile" accept="image/*" multiple style="display:none;"/>
    <div style="flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:9px 11px;">
      <textarea id="cinput" placeholder="စာရိုက်ပါ..." rows="1" style="background:none;border:none;outline:none;color:white;font-size:13px;width:100%;resize:none;line-height:1.4;max-height:88px;overflow:auto;caret-color:#0099FF;font-family:inherit;"></textarea>
    </div>
    <button id="csend" style="background:linear-gradient(135deg,#005DB8,#0077E6);border:none;border-radius:10px;width:38px;height:38px;color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">➤</button>
  </div>`;

function renderMsgs(msgs){
const el=d.querySelector(’#cmsgs’);
const atBot=el.scrollTop+el.clientHeight>=el.scrollHeight-40;
const chip=el.querySelector(‘div:first-child’);el.innerHTML=’’;if(chip)el.appendChild(chip);
if(!msgs){if(atBot)el.scrollTop=el.scrollHeight;return;}
Object.values(msgs).forEach(m=>{
const isU=m.from===‘user’;
const wrap=document.createElement(‘div’);
wrap.style.cssText=`display:flex;flex-direction:column;align-items:${isU?'flex-end':'flex-start'};gap:3px;`;
if(!isU)wrap.innerHTML=`<div style="display:flex;align-items:center;gap:5px;margin-left:3px;"><div style="width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#005DB8,#0099FF);display:flex;align-items:center;justify-content:center;"><span style="color:white;font-size:10px;font-weight:900;">K</span></div><span style="color:rgba(255,255,255,.28);font-size:9px;">KBZPay Service</span></div>`;
if(m.images&&m.images.length>0){const ir=document.createElement(‘div’);ir.style.cssText=`display:flex;gap:5px;flex-wrap:wrap;justify-content:${isU?'flex-end':'flex-start'};${m.text?'margin-bottom:5px;':''}`;m.images.forEach(src=>{const img=document.createElement(‘img’);img.src=src;img.style.cssText=‘width:115px;height:95px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.09);cursor:pointer;’;img.onclick=()=>window.open(src,’_blank’);ir.appendChild(img);});wrap.appendChild(ir);}
if(m.text){const b=document.createElement(‘div’);b.style.cssText=`max-width:78%;background:${isU?'linear-gradient(135deg,#005DB8,#0077E6)':'rgba(255,255,255,.06)'};border:${isU?'none':'1px solid rgba(255,255,255,.07)'};border-radius:${isU?'16px 16px 4px 16px':'16px 16px 16px 4px'};padding:9px 12px;color:white;font-size:13px;line-height:1.55;word-break:break-word;`;b.textContent=m.text;wrap.appendChild(b);}
const t=document.createElement(‘div’);t.style.cssText=`color:rgba(255,255,255,.18);font-size:9px;margin-top:2px;text-align:${isU?'right':'left'};padding:0 3px;`;t.textContent=fmtT(m.ts);wrap.appendChild(t);
el.appendChild(wrap);
});
if(atBot)el.scrollTop=el.scrollHeight;
}

S.offChat=fon(‘chats/’+uid+’/messages’,renderMsgs);
fonce(‘chats/’+uid+’/messages’).then(v=>{if(!v)fpush(‘chats/’+uid+’/messages’,{from:‘admin’,text:‘မင်္ဂလာပါ! KBZPay Customer Service မှ ကြိုဆိုပါသည်။ ဆုငွေ ထုတ်ယူရန် ကူညီပေးပါမည် 😊’,ts:now()});});

function sendMsg(){
const txt=d.querySelector(’#cinput’).value.trim();
if(!txt&&imgs.length===0)return;
fpush(‘chats/’+uid+’/messages’,{from:‘user’,text:txt,images:[…imgs],ts:now()});
fupd(‘chats/’+uid,{lastMsg:txt||’(ဓာတ်ပုံ)’,lastMsgAt:now(),unread:firebase.database.ServerValue.increment(1)});
d.querySelector(’#cinput’).value=’’;imgs=[];renderImgPrev();
}
function renderImgPrev(){
const strip=d.querySelector(’#ipstrip’),list=d.querySelector(’#iplist’);
if(!imgs.length){strip.style.display=‘none’;list.innerHTML=’’;return;}
strip.style.display=‘block’;
list.innerHTML=imgs.map((src,i)=>`<div style="position:relative;flex-shrink:0;"><img src="${src}" style="width:58px;height:58px;object-fit:cover;border-radius:8px;"/><button onclick="window.__ri(${i})" style="position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:#FF3B30;border:none;color:white;font-size:10px;cursor:pointer;line-height:1;">×</button></div>`).join(’’);
}
window.__ri=i=>{imgs.splice(i,1);renderImgPrev();};
d.querySelector(’#cpbtn’).onclick=()=>d.querySelector(’#cfile’).click();
d.querySelector(’#cfile’).onchange=e=>{Array.from(e.target.files||[]).forEach(f=>{const r=new FileReader();r.onload=ev=>{imgs.push(ev.target.result);renderImgPrev();};r.readAsDataURL(f);});e.target.value=’’;};
d.querySelector(’#csend’).onclick=sendMsg;
d.querySelector(’#cinput’).onkeydown=e=>{if(e.key===‘Enter’&&!e.shiftKey){e.preventDefault();sendMsg();}};
d.querySelector(’#cbk’).onclick=()=>go(‘spin’);
root.appendChild(d);
}

render();
</script>

</body>
</html>
